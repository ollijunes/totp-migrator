name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.0"
          args: check --output-format github
      - run: ruff format --check .

  # Imports real exports into a throwaway Vaultwarden with the official
  # Bitwarden CLI and checks every code. Versions are pinned so a change in
  # either one shows up as a deliberate bump.
  import-vaultwarden:
    runs-on: ubuntu-latest
    env:
      VAULTWARDEN_IMAGE: "vaultwarden/server:1.37.4"
      BITWARDEN_CLI_VERSION: "2026.9.1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global "@bitwarden/cli@${BITWARDEN_CLI_VERSION}"
      - run: python -m pip install "cryptography==46.0.3"
      - run: integration/start_vaultwarden.sh "$RUNNER_TEMP/vw" 8443 "$VAULTWARDEN_IMAGE"
      - run: python integration/vaultwarden_import.py --server https://127.0.0.1:8443 --bw bw
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/vw/ssl/cert.pem

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The binary, pinned by checksum, scans the whole history on every run.
      - name: Scan full history with gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
